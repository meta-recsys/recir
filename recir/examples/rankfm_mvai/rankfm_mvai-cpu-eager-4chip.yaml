# RankFM (xsurface V3) pure CPU eager training on 4-chip TPU v7 slice (1 node, 2x2x1)
#
# train_cpu_eager runs
# forward/backward/SGD natively on the host CPU and never touches the 4 TPU
# chips. The chip request is just how we get scheduled onto a node in the
# TPU pool.
#
# Uses the BarnFS dataporter dump (real data, replay mode). The CSI driver
# mounts gs://mrs-tpu-y317h/datasets/udd_fm_20260415_dump/ at /mnt/barnfs;
# --data_file_template skips the 58-min `ls` enumeration and reads files
# on-demand via FUSE lazy lookup.
#
# Run the job
# $ IMAGE_TAG=cpu-eager bash recir/examples/rankfm/build_image_podman.sh
# $ JS=$(kubectl create -f recir/examples/rankfm/rankfm-cpu-eager-4chip.yaml -o jsonpath='{.metadata.name}'); echo "submitted $JS"
# $ kubectl get pods -n ns-mrs-core-shared -l jobset.sigs.k8s.io/jobset-name=$JS -w
# kubectl logs -n ns-mrs-core-shared -l jobset.sigs.k8s.io/jobset-name=$JS --tail=120
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-cpu-eager-4chip-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          spec:
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:cpu-eager
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              - >-
                RANK=${JOB_COMPLETION_INDEX:-0} ;
                FIRST_FILE=rank_${RANK}_batch_1.pt.zst ;
                echo "Pod $RANK waiting for /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "barnfs mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train_cpu_eager
                --max_steps 5000
                --local_batch_size 32
                --num_candidates 32
                --gcs_data_path /mnt/barnfs
                --data_file_template "rank_${RANK}_batch_{i}.pt.zst"
                --data_replicate_across_ranks
                --tb_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}/tb"
                --tb_log_every 1
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            # BarnFS dataporter dump, mounted by the barnfs.csi.meta.com CSI
            # driver. The driver stages the GCS bucket with its own gcsfuse and
            # runs `barndle mount` on the dump dir, authenticating with the
            # cluster-level BarnFS credential (GKE Workload Identity + Internet
            # Shepherd) -- so no per-pod barnfs-certs secret is required.
            - name: barnfs-data
              csi:
                driver: barnfs.csi.meta.com
                readOnly: true
                volumeAttributes:
                  sourcePath: "gs://mrs-tpu-y317h/datasets/udd_fm_20260415_dump/"
