# RankFM-MVAI (xsurface V3) CPU-EAGER 16-HOST DDP run -- the CPU reference half
# paired with rankfm_mvai-64chip.yaml. Both sides run WORLD_SIZE=16 and read the
# same replicated rank_0 data stream, so compare_experiment.py can compare NE and
# TensorBoard output across the compiled TPU and CPU-eager implementations.
#
# CPU eager does not need a unified TPU slice. These pods land on 16 independent
# 4-chip (2x2x1) tpu7x nodes and use the host CPU without requesting TPU chips.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-mvai-eager-16host-
  namespace: ns-mrs-core-shared
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 16
        completions: 16
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
            labels:
              app.kubernetes.io/name: rankfm-mvai-eager
          spec:
            serviceAccountName: default
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: rankfm-mvai-eager
                  matchLabelKeys:
                  - jobset.sigs.k8s.io/jobset-name
                  topologyKey: kubernetes.io/hostname
            containers:
            - name: rankfm-mvai
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_PLATFORMS
                value: "cpu"
              - name: WORLD_SIZE
                value: "16"
              - name: MASTER_PORT
                value: "29500"
              - name: GLOO_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MVAI_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MAST_HPC_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              - >-
                RANK=${JOB_COMPLETION_INDEX:-0} ; export RANK ;
                JOBSET_NAME=$(echo "$HOSTNAME" | sed -E 's/-worker-.*//') ;
                export JOBSET_NAME ;
                export MVAI_JOB_NAME="$JOBSET_NAME" ;
                export MASTER_ADDR="${JOBSET_NAME}-worker-0-0.${JOBSET_NAME}" ;
                echo "Pod RANK=$RANK WORLD_SIZE=$WORLD_SIZE MASTER_ADDR=$MASTER_ADDR" ;
                FIRST_FILE=rank_0_batch_1.pt.zst ;
                echo "Pod $RANK waiting for /mnt/gcs-out/rankfm_1shard_data/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/gcs-out/rankfm_1shard_data/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "data mount ready (after $(($(date +%s) - START))s); starting CPU-eager DDP trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train_cpu_eager
                --max_steps 5000
                --local_batch_size 32
                --num_candidates 20
                --no_bf16_training
                --hash_size_cap 10000
                --l1_num_layers 3
                --l2_num_layers 11
                --max_uih_seq_len 3072
                --l2_max_seq_len 512
                --disable_seq_len_sampling
                --seq_ro_per_sample_budget 3072
                --embedding_backend cpu
                --gcs_data_path /mnt/gcs-out/rankfm_1shard_data
                --data_file_template "rank_0_batch_{i}.pt.zst"
                --data_replicate_across_ranks ;
                rc=$? ;
                if [ "${RANK}" = "0" ]; then
                  echo "Copying TensorBoard events -> gs://cq-mrs-core-shared_mrs_tpu_y317h/tensorboard/${JOBSET_NAME} ..." ;
                  mkdir -p /mnt/gcs-out/tensorboard/${JOBSET_NAME} ;
                  cp /mnt/gcs/mvai_cloud/tensorboard/${JOBSET_NAME}/* /mnt/gcs-out/tensorboard/${JOBSET_NAME}/ || true ;
                fi ;
                exit $rc
              volumeMounts:
              - name: tensorboard
                mountPath: /mnt/gcs/mvai_cloud
              - name: tb-gcs
                mountPath: /mnt/gcs-out
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "2x2x1"
              cloud.google.com/gke-accelerator-count: "4"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            - name: tensorboard
              emptyDir: {}
            - name: tb-gcs
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  mountOptions: "implicit-dirs"
