# RankFM (mvai) padding-inertness parity -- COMPILED-PADDED vs COMPILED-JAGGED.
#
# Runs the COMPILED mvai pipeline twice from the same seeded init + batch -- once
# padded, once jagged -- and diffs the dense over-arch weights, varying ONLY
# padding. DCN is ON (this image stages the mrs/hpc DCN files), so this covers
# DCN's padding inertness too. The jagged (unpadded) run cannot shard across a
# multi-device mesh, so this is SINGLE-DEVICE: CPU-spoof with one device
# (PARITY_CPU_DEVICES=1) and PARITY_BATCH_RANKS=8 so the batch is non-degenerate.
# No TPU needed -- a plain CPU pod.
#
# Prereq: (re)build+push the rankfm_mvai_tpu image from the TOP of the stack:
#   IMAGE_TAG=plund-parity bash recir/examples/rankfm_mvai/build_image_podman.sh
# Submit:
#   kubectl create -f recir/examples/rankfm_mvai/rankfm_mvai-parity-cc-cpu.yaml \
#     -n ns-mrs-core-shared
# (Or run locally with podman -- same env vars + the python3 -m command below.)
apiVersion: v1
kind: Pod
metadata:
  generateName: rankfm-mvai-parity-cc-
  namespace: ns-mrs-core-shared
spec:
  serviceAccountName: default
  restartPolicy: Never
  containers:
  - name: parity-cc
    image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:plund-parity
    imagePullPolicy: Always
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTHONFAULTHANDLER
      value: "1"
    # Force CPU. This is a TPU image (defaults PJRT_DEVICE=TPU); on a TPU node
    # JAX would try (and fail) to init the TPU backend. Override both so the pod
    # stays on CPU regardless of which node it lands on.
    - name: JAX_PLATFORMS
      value: "cpu"
    - name: PJRT_DEVICE
      value: "cpu"
    - name: PARITY_DEVICE
      value: "cpu"
    - name: PARITY_CPU_DEVICES
      value: "1"
    - name: PARITY_BATCH_RANKS
      value: "8"
    - name: PARITY_INPUT
      value: "random"
    command:
    - bash
    - -c
    - |
      set -euo pipefail
      echo "=== rankfm_mvai parity: compiled-padded vs compiled-jagged (single device, DCN on) ==="
      python3 -u -m recir.examples.rankfm_mvai.parity_forward_loss
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "4"
        memory: 16Gi
  tolerations:
  - key: google.com/tpu
    operator: Exists
    effect: NoSchedule
