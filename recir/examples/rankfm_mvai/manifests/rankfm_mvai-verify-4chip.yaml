# Fast 4-chip verification of the prod-faithful COMPILED path.
#
# A yes/no on trace- and runtime-level defects in minutes instead of a 4x4x8
# slice. Prod's own config throughout -- the artifact, its seq-len sampling,
# its dropout -- except --hash_size_cap, so 4 chips can hold the tables.
#
# Every knob that reaches the batch matches rankfm_mvai-64chip.yaml, so an
# input-path failure here is that failure at 1/16 the chips. Nothing about the
# 3e9 vocabulary, id widths or HBM is exercised, though: that needs the
# 128-chip manifest. And reaching the last step is not the same as being
# correct -- a constant PRNG key and a frozen LR both run clean to completion,
# and both were caught only by reading the HLO.
#
# RUN
#
#   export HTTPS_PROXY=http://fwdproxy:8080
#   kubectl create -f recir/examples/rankfm_mvai/manifests/rankfm_mvai-verify-4chip.yaml \
#       -n ns-mrs-core-shared
#   kubectl logs -n ns-mrs-core-shared <pod> -c rankfm
#
# The container is `rankfm` here, not `rankfm-mvai` as in the 128-chip
# manifest. Confirm the replay pipe was built before reading anything else:
#
#   [OVERRIDE+TRACE] using first replay batch (real data)   model_family.py:925
#
# "Using synthetic data (no --gcs_data_path)" instead means the run never
# opened the dump, and the synthetic generator's hard-coded 68 tasks then fail
# in _supervision_remap against a 90-task prod artifact -- a manifest defect
# wearing a data defect's error message.
#
# scripts/sync_run_artifacts.sh <jobset-name> mirrors TensorBoard and the
# xprof trace to Manifold.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-verify-4chip-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:prod
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # The whole gate for digests on the compiled leg -- empty means the
              # traced graph contains none of it. Not PARITY_EMIT_DIGEST, which
              # arms the eager side only. Read at TRACE time, so an armed and an
              # unarmed run are not bit-identical.
              - name: PARITY_DIGEST_KINDS
                value: ""
              # "1" names an op (~30k log lines), "full" dumps the FX graph plus
              # HLO (~270k).
              - name: RECIR_DUMP_GRAPHS
                value: "0"
              # Leak probe, test arm: keep floor(nc/N) candidates per sample and
              # emit each N times, adjacent. The copies are one candidate, so
              # spread between them at a stage is that stage mixing candidates.
              # "0" is off. See parity/leak_probe/.
              - name: RANKFM_DUP_TARGETS
                value: "10"
              # "1" = control arm: the same survivors, emitted once. Both arms
              # score the same candidates and share a model shape, so a
              # difference between runs is the duplication, not the sampling.
              - name: RANKFM_DUP_CONTROL
                value: "0"
              # Pins torch's global RNG (applied by leak_probe.install) so the
              # two arms get identical dense init and UIH sampling.
              - name: RANKFM_TORCH_SEED
                value: "0"
              # Python stack on a fatal signal; a SIGSEGV otherwise leaves only
              # stripped native frames and signal-handler noise.
              - name: PYTHONFAULTHANDLER
                value: "1"
              - name: JAX_ENABLE_X64
                value: "1"
              # Makes --prod_faithful work without //minimal_viable_ai, which is
              # not staged into this image. See prod_config_artifact.py.
              - name: PROD_CONFIG_ARTIFACT
                value: /mnt/prodcfg/prod_cfg.pt
              # Mirrored from rankfm_mvai-parity-4chip.yaml so the TPU codegen
              # path matches the other compiled runs.
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_enable_async_collective_permute=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_data_parallel_opt_different_sized_ops=true
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
              # The block below is a FOLDED scalar (>-): every line joins into ONE
              # shell command, so a '#' anywhere inside silently comments out the
              # rest of it. Annotate up here, never in place.
              #
              # No --grad_accum_steps, so one progress() is one micro-batch is
              # one optimizer step and `[Replay] step N` means compiled calls.
              #
              # --local_batch_size 2048 is a MULTIPLE of the dump's own 512, so
              # the loader merges 4 files/step and select_rows_slice is a no-op.
              # A non-multiple silently trains on a rotating subsample.
              #
              # Profile window starts at 11 because steps 0-1 are trace plus
              # compile; opened there it captures compilation, not the step.
              command:
              - sh
              - -c
              - >-
                echo "=== jax devices (see header note 1) ===" ;
                python3 -c "import jax; print(jax.devices())" ;
                FIRST_FILE=rank_0/batch_0/0.pt.zst ;
                echo "waiting for /mnt/barnfs/metadata.json and /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/metadata.json ] || [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "data mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train
                --prod_faithful
                --embedding_backend in_graph
                --max_steps 30
                --pipeline_preprocessor
                --local_batch_size 2048
                --seq_len_cap 1024
                --hash_size_cap 100000
                --gcs_data_path /mnt/barnfs
                --metrics_report_interval 10
                --pull_metrics_every 10
                --profile_start_step 11
                --profile_end_step 19
                --profile_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}"
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
              - name: prod-cfg
                mountPath: /mnt/prodcfg
                readOnly: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            restartPolicy: Never
            volumes:
            - name: barnfs-data
              csi:
                driver: barnfs.csi.meta.com
                readOnly: true
                volumeAttributes:
                  sourcePath: "gs://mrs-tpu-y317h/czheo_test/udd_fm_3d_20260824/dataporter_2:prod:dataporter:xdb.mwfs_orchestration_prod:4070:467780:v0/"
            - name: prod-cfg
              configMap:
                name: rankfm-prod-cfg
