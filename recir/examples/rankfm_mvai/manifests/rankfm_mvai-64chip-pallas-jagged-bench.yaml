# RankFM jagged-Pallas WEAK-SCALING benchmark on a 64-chip TPU v7 slice (4x4x4).
#
# Scales the single-host 4-chip bench (rankfm-4chip-bench.yaml) to 16 hosts x 4
# chips = 64 chips, keeping --local_batch_size 512 PER HOST (so ~128/chip is
# unchanged) -> global batch = 512 * 16 = 8192. This is weak scaling: 16x the
# chips and 16x the global batch at constant per-chip work, so ideal throughput
# (examples/s) scales 16x vs the 4-chip baseline. Scaling efficiency is
# (ex/s_64 / ex/s_4) / 16.
#
# Model, batch, data, and TPU settings match the 64-chip Helion control in
# rankfm_mvai-64chip-bench.yaml. Only the generated job name and
# RANKFM_MVAI_ATTENTION_BACKEND select this Pallas variant.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-64chip-pallas-jagged-bench-
  namespace: ns-mrs-core-shared
  labels:
    kueue.x-k8s.io/queue-name: lq-training
    x.tpu.cloud.google.com/slice-autoprovisioning: "async"
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          x.tpu.google.com/inject-slice-selector: "true"
      spec:
        parallelism: 16
        completions: 16
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x4"
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              # Read packed Q/K/V directly in the experimental Pallas attention
              # kernel. Compare against the pallas-padded sibling manifest.
              - name: RANKFM_MVAI_ATTENTION_BACKEND
                value: "pallas_jagged"
              # The sample-sharded HSTU path assumes each chip's L//world_size token
              # block is exactly its b_local whole sequences; the CPU unit tests
              # assert that alignment at build time.
              # --- crash diagnostics (this run only) ---
              # PYTHONFAULTHANDLER: on a C-level fatal signal (SIGSEGV), dump
              # every thread's Python stack to stderr -> names the in-flight call
              # site (torchrec/fbgemm embedding A2A = host, vs jax device_put /
              # lowering = TPU path), settling host-vs-libtpu.
              - name: PYTHONFAULTHANDLER
                value: "1"
              # Include C++ stack traces (with symbols) in any torch/c10 error.
              - name: TORCH_SHOW_CPP_STACKTRACES
                value: "1"
              # Skip the (very slow / hanging) addr2line C++ symbolization so the
              # exception MESSAGE + Python traceback print immediately. Without
              # this, a torch C++ exception hangs for minutes in symbolization.
              - name: TORCH_DISABLE_ADDR2LINE
                value: "1"
              # Don't hide framework frames if a JAX-side error surfaces.
              - name: JAX_TRACEBACK_FILTERING
                value: "off"
              # Extend the multi-host TPU init barrier deadline so slower-starting
              # pods don't time out the faster ones at jax.distributed.initialize()
              # (16 hosts). Mirrors rankfm-128chip.yaml.
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "1800"
              - name: TPU_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: TPU_LIBRARY_INIT_TIMEOUT
                value: "1800"
              # libtpu compiler flags to overlap the data-parallel gradient
              # all-reduces with backward compute (even more important at 64 chips,
              # where the all-reduce spans the 4x4x4 ICI torus). NOTE: libtpu FATALs
              # on an unknown flag; if a pod dies at JAX init with "Unknown flag",
              # drop the offender.
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_enable_async_collective_permute=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_data_parallel_opt_different_sized_ops=true
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_tpu_all_gather_collective_matmul_mode=post_spmd
                  --xla_tpu_reduce_scatter_collective_matmul_mode=post_spmd
                  --xla_enable_async_all_gather=true
              # Fixed UIH history length S (matches the 4-chip bench default).
              - name: RANKFM_S
                value: "4096"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Ringshift backend: recv_capacity is now the VMEM CHUNK-TILE size,
              # NOT a per-pair payload bound (chunked-recv fix in ringshift.py).
              # The full per-pair payload is staged in HBM (auto-sized to
              # max_local_ids+W*TILE rounded to a multiple of recv_capacity) and the
              # on-chip gather/scatter runs in ceil(staging/recv_capacity) chunks.
              # At S=4096 (max_local_ids ~271k) that's ~18 chunks at 16384.
              # VMEM budget (fwd): zero_emb_vmem[16384,256]f32 ~16MB + table ~8MB
              # = ~24MB < 64MB; (bwd) grad_emb + grad_table_acc + zero ~40MB < 64MB.
              # Smaller = less VMEM, more chunks (any TILE multiple is correct now).
              - name: RECIR_RINGSHIFT_RECV_CAPACITY
                value: "16384"
              # Exchange the cross-host embedding (fwd) + gradient (bwd) all-to-all
              # in bf16 to halve the ICI bytes (the S=4096 bottleneck: ~66% of the
              # step was TensorCore idle waiting on OFFLOAD_COLLECTIVE). Table +
              # grad accumulation stay f32; the public embedding/grad stay f32.
              - name: RECIR_RINGSHIFT_EXCHANGE_BF16
                value: "1"
              # E2E ablation knobs (perf-only; outputs are garbage when set).
              # Flip across runs to attribute the ring-shift per-wave cost:
              #   SKIP_GATHER=1   -> skip the TC row-by-row gather/scatter, keep DMA+prefetch
              #   SKIP_DMA=1      -> skip the cross-host all-to-all, keep gather+prefetch
              #   SKIP_PREFETCH=1 -> skip the per-wave 8MB table_vmem sync_copy, keep gather+DMA
              #   all=1           -> barrier + fixed-overhead floor
              # Decompose: phase_cost = baseline - SKIP_<phase>.
              - name: RECIR_RINGSHIFT_SKIP_GATHER
                value: "0"
              - name: RECIR_RINGSHIFT_SKIP_DMA
                value: "0"
              - name: RECIR_RINGSHIFT_SKIP_PREFETCH
                value: "0"
              # Log the per-rank ring-shift LOAD (rank-0): valid id count, per-peer
              # send counts, per-wave DMA rows (p1) + gather rows (p3), exchange
              # bytes. Lets us confirm E2E vs microbench move the same #lookups/bytes
              # before attributing per-phase time. Grep "[RS_LOAD]" in the log.
              - name: RECIR_RINGSHIFT_LOG_LOAD
                value: "0"
              # Re-enabled to read jit_jax_fn HLO instruction count after batching
              # (does 12->4 kernels shrink it under the SPMD partitioner limit?).
              - name: TPU_STDERR_LOG_LEVEL
                value: "0"
              # gs:// dump didn't work (XLA dumper can't write GCS here). Instead log
              # each HLO pass name as it runs -> the last pass before the segfault
              # names the crashing pass (reliable log channel; pod FS is lost on
              # crash). Local dump kept as a long shot if the pod lingers.
              - name: TF_CPP_VMODULE
                value: "hlo_pass_pipeline=2,deepsea_compiler_hlo_passes=2"
              - name: XLA_FLAGS
                value: >-
                  --xla_dump_to=/tmp/xladump
                  --xla_dump_hlo_as_text
                  --xla_dump_hlo_module_re=jit_jax_fn
              # Perf-debug knobs (off by default; flip on to debug XLA lowering).
              # RECIR_DUMP_GRAPHS=1: log each XLA subgraph's FX index/scatter ops +
              #   HLO collectives, and jagged<->dense lowering branch decisions.
              - name: RECIR_DUMP_GRAPHS
                value: "0"
              # JAX persistent compilation cache (skip cold XLA compile on reruns).
              # To dump HLO instead, comment this out (a cache hit dumps nothing).
              - name: JAX_COMPILATION_CACHE_DIR
                value: "gs://cq-mrs-core-shared_mrs_tpu_y317h/jax-compile-cache"
              - name: JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES
                value: "-1"
              - name: JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS
                value: "0"
              command:
              - sh
              - -c
              - >-
                python3 -u -m recir.examples.rankfm_mvai.train
                --local_batch_size 512
                --l1_num_layers 8
                --l2_num_layers 10
                --max_uih_seq_len "${RANKFM_S}"
                --l2_max_seq_len 512
                --num_candidates 10
                --seq_ro_per_sample_budget "${RANKFM_S}"
                --max_steps 50
                --disable_seq_len_sampling
                --enable_padding
                --embedding_backend in_graph
                --bf16_training
                --profile_start_step 30
                --profile_end_step 35
                --profile_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}"
                --enable_memory_log
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "4x4x4"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
