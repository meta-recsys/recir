# RankFM (xsurface V3) prod-faithful COMPILED (in_graph, TPU) training, one step,
# for the parity comparison against the light (hammer v3) leg.
#
# The third leg. rankfm_mvai-parity-cpu-eager.yaml runs the same comparison with
# the embedding update off the compiled graph; this one puts the whole step --
# forward, backward, and BOTH optimizers -- inside one GSPMD program, which is
# what production would run. Design notes: docs/COMPILED_PARITY_PLAN.md.
# Operating instructions: docs/TPU_DIGEST_RUNBOOK.md.
#
# Drop-in for the existing driver, which patches image tag, max_steps,
# grad_accum_steps, hash_size_cap, --init_state_dict_path and the digest env:
#
#   buck2 run //hammer/v3/models/udd_fm_v3/parity:compare -- \
#       --jobset rankfm_mvai-parity-in-graph.yaml
#
# patch_yaml_parity ASSERTS on this file's shape (harness.py:385-487), so keep:
#   * exactly ONE line matching --hash_size_cap <digits> -- including comments,
#     which is why no comment here writes that flag with a number after it;
#   * --max_steps and --grad_accum_steps flag lines to rewrite;
#   * a bare --prod_faithful line, the anchor for --init_state_dict_path and
#     --disable_seq_len_sampling;
#   * a `- name: PROD_CONFIG_ARTIFACT` env entry, the anchor for the digest env.
#
# TWO THINGS TO VERIFY IN THE POD LOG BEFORE TRUSTING A RUN
#
# 1. DEVICE COUNT. num_ranks is jax.device_count() (model_family.py:605) and
#    there is no override flag. 2x2x1 is 4 chips but EIGHT jax devices, while
#    light runs 4 ranks -- and the embedding tables only pair between the legs
#    if both put the same rows at the same index. The first line the container
#    prints is the device list; if it shows 8, the DENSE comparison is still
#    valid (the plan treats it as the authoritative one) but the embedding
#    tables will be reported and not asserted, exactly as they are in today's
#    light-vs-CPU-eager report. Getting 4 needs a smaller topology, not a flag.
#
# 2. DATA-TO-RANK MAPPING. --data_replicate_across_ranks is inherited from the
#    cpu-eager leg, where it is right because that leg is single-rank. Here it
#    hands every device the SAME batch, while light gives each of its 4 ranks a
#    different one. That is fine for a shape/mechanism check and NOT fine for a
#    gradient comparison. Settle it before reading any gradient ratio.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-parity-in-graph-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          metadata:
            annotations:
              # Injects the gcsfuse CSI sidecar for the parity-ckpt volume below.
              # Without it the volume never mounts and the pod hangs on the
              # missing file rather than reporting anything useful.
              gke-gcsfuse/volumes: "true"
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:linjianma-parity
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Which digests recir_train_step emits from inside the compiled
              # program. This is the WHOLE gate for the compiled leg: unset or
              # empty and the traced graph contains none of it. Distinct from
              # PARITY_EMIT_DIGEST, which the driver injects and which arms the
              # EAGER instrumentation -- setting only that one produces a run
              # with zero digest lines and no indication why.
              #
              # Read at TRACE time, so it changes the graph: an armed and an
              # unarmed run are not bit-identical and must not be compared
              # across that boundary.
              - name: PARITY_DIGEST_KINDS
                value: "loss,grad,winit,weight"
              # Diagnostic: print the make_fx graph with per-node shapes and
              # stack traces (api.py:75-87). On for the GSPMD batch-dim
              # investigation -- the (105, 10400) per-task tensor reaches
              # xla_lower with batch_dim=0 and gets its TASK axis sharded, and
              # the dump is what names the node that lost the real axis.
              # Verbose; drop it once that is settled.
              - name: RECIR_DUMP_GRAPHS
                value: "1"
              # Makes --prod_faithful work without //minimal_viable_ai, which is
              # not staged into this image. See prod_config_artifact.py.
              - name: PROD_CONFIG_ARTIFACT
                value: /mnt/prodcfg/prod_cfg.pt
              # Mirrored from rankfm_mvai-parity-4chip.yaml so the TPU codegen
              # path matches the other compiled runs.
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_enable_async_collective_permute=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_data_parallel_opt_different_sized_ops=true
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
              # NOTE: the block below is a FOLDED scalar (>-). Every line joins
              # into ONE shell command, so a '#' anywhere inside comments out
              # the whole rest of the command, silently. Do not annotate flags
              # in place -- put remarks up here instead.
              #
              # --max_steps and --grad_accum_steps are rewritten on every submit
              # by the compare driver; the values below stand only for a direct
              # kubectl apply. They must MOVE TOGETHER: --max_steps feeds the
              # data source's num_batches, so setting it below grad_accum_steps
              # makes the loader run dry and the trainer exits without ever
              # completing an optimizer step -- cleanly, and with no digest.
              #
              # --init_state_dict_path is injected by the driver next to
              # --prod_faithful. The FILE, not the mount point: the gcsfuse CSI
              # ignores onlyDir and mounts the whole bucket, so the path carries
              # the bucket-relative parity/ prefix, and /mnt/parity alone is a
              # directory that fails with IsADirectoryError.
              command:
              - sh
              - -c
              - >-
                echo "=== jax devices (see header note 1) ===" ;
                python3 -c "import jax; print(jax.devices())" ;
                FIRST_FILE=parity_dump/rank_0/batch_0/0.pt.zst ;
                echo "waiting for /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "data mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train
                --prod_faithful
                --disable_seq_len_sampling
                --embedding_backend in_graph
                --no_on_device_init
                --max_steps 4
                --grad_accum_steps 4
                --local_batch_size 512
                --hash_size_cap 100000
                --light_loss_norm
                --gcs_data_path /mnt/barnfs/parity_dump
                --data_replicate_across_ranks
                --metrics_report_interval 1
                --pull_metrics_every 1
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
              - name: prod-cfg
                mountPath: /mnt/prodcfg
                readOnly: true
              # Shared init weights. The comparison is only meaningful from
              # identical starting weights, and the compare stage refuses to run
              # when the two legs log different init ckpt sha256.
              - name: parity-ckpt
                mountPath: /mnt/parity
                readOnly: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            restartPolicy: Never
            volumes:
            # The dump the light leg replays, staged to GCS in the v0 layout
            # (rank_R/batch_0/0.pt.zst + metadata.json) and served by gcsfuse.
            # NOT the barnfs CSI: that driver is not registered on the TPU nodes
            # this jobset schedules to.
            - name: barnfs-data
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  mountOptions: "implicit-dirs"
            - name: prod-cfg
              configMap:
                name: rankfm-prod-cfg
            - name: parity-ckpt
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  # cq-mrs-core-shared_mrs_tpu_y317h, not mrs-tpu-y317h: the
                  # latter holds the dump but is read-only for us
                  # (storage.objects.create denied), so the checkpoint is staged
                  # in the same bucket TensorBoard already writes to.
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  # onlyDir is not honored by this CSI driver as a
                  # volumeAttribute -- the whole BUCKET mounts at the mount
                  # point. implicit-dirs so the prefix appears as a real
                  # directory; GCS has no directories, only key prefixes.
                  mountOptions: "implicit-dirs"
