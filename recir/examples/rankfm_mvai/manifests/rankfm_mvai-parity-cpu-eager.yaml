# RankFM (xsurface V3) prod-faithful CPU-eager training, for NE comparison
# against the light (hammer v3) leg on the SAME Manifold dump.
#
# This is the recir arm of the light-vs-recir parity comparison; see
# recir/examples/rankfm_mvai/docs/PARITY_HANDOVER.md. It differs from
# rankfm_mvai-cpu-eager-4chip.yaml in four ways that all matter for validity:
#
#   1. sourcePath points at the BarnFS copy of czheo_test/udd_fm_3d_20260722 --
#      the dump the light leg replays. The other manifest reads a DIFFERENT
#      dump (udd_fm_20260415_dump), which would make any comparison meaningless.
#   2. NO --data_file_template. That flag resolves to exactly ONE file
#      (xsurface_helpers._build_data_pipe:127-128) which replay_batch_iter then
#      recycles, so those manifests are throughput benchmarks, not training
#      runs. Without it, data_pipe._discover_files reads metadata.json and
#      computes the v0 filenames arithmetically -- no `ls` enumeration cost.
#   3. --local_batch_size 512, the dump's baked KJT stride, not 32.
#   4. --prod_faithful via PROD_CONFIG_ARTIFACT, so this trains the same model
#      the light leg does rather than the standalone udd_fm defaults.
#
# The chip request is only how we get scheduled onto a node in the TPU pool;
# train_cpu_eager runs forward/backward/optimizer on the host CPU and never
# touches the chips.
#
# Prerequisites:
#   # 1. export the prod config (devserver, under buck) at the SAME seq len
#   #    the light leg used:
#   HSTU_MAX_SEQ_LEN=512 buck2 run //recir/examples/rankfm_mvai:export_prod_config \
#       -- --out /tmp/prod_cfg_seq512.pt
#   # 2. publish it to the cluster (72KB, well under the 1MB ConfigMap limit):
#   kubectl create configmap rankfm-prod-cfg -n ns-mrs-core-shared \
#       --from-file=prod_cfg.pt=/tmp/prod_cfg_seq512.pt --dry-run=client -o yaml \
#       | kubectl apply -f -
#   # 3. build + push the image:
#   IMAGE_TAG=linjianma-parity bash recir/examples/rankfm_mvai/scripts/build_image_podman.sh
#   # 4. submit:
#   JS=$(kubectl create -f recir/examples/rankfm_mvai/manifests/rankfm_mvai-parity-cpu-eager.yaml \
#        -o jsonpath='{.metadata.name}'); echo "submitted $JS"
#   kubectl logs -n ns-mrs-core-shared -l jobset.sigs.k8s.io/jobset-name=$JS --tail=120 -f
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-parity-cpu-eager-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          metadata:
            annotations:
              # Injects the gcsfuse CSI sidecar for the parity-ckpt volume below.
              # Without this the volume never mounts and the pod hangs on the
              # missing file rather than reporting anything useful.
              gke-gcsfuse/volumes: "true"
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:linjianma-parity
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Makes --prod_faithful work without //minimal_viable_ai, which is
              # not staged into this image. See prod_config_artifact.py.
              - name: PROD_CONFIG_ARTIFACT
                value: /mnt/prodcfg/prod_cfg.pt
              # torch comes up single-threaded by default; the first run of this
              # manifest sat at exactly 1.0 core for 18 minutes. Locally, going
              # from 1 to 64 threads was an 8.6x speedup on a CPU training step
              # (179.6s -> 20.9s) with a bit-identical loss.
              - name: OMP_NUM_THREADS
                value: "64"
              # NOTE: the block below is a FOLDED scalar (>-). Every line joins
              # into ONE shell command, so a '#' anywhere inside comments out
              # the whole rest of the command, silently. Do not annotate flags
              # in place -- put remarks here instead.
              #
              # --max_steps and --grad_accum_steps are rewritten on every submit
              # by compare_experiment.py: --max_steps to --max-steps (default
              # 2000), or both to --parity-micro-batches under --parity-step.
              # The values below stand only for a direct kubectl apply.
              command:
              - sh
              - -c
              - >-
                FIRST_FILE=parity_dump/rank_0/batch_0/0.pt.zst ;
                echo "waiting for /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "barnfs mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train_cpu_eager
                --prod_faithful
                --max_steps 300
                --local_batch_size 512
                --grad_accum_steps 4
                --hash_size_cap 1000000
                --light_loss_norm
                --gcs_data_path /mnt/barnfs/parity_dump
                --data_replicate_across_ranks
                --metrics_report_interval 1
                --pull_metrics_every 1
                --tb_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}/tb"
                --tb_log_every 1
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
              - name: prod-cfg
                mountPath: /mnt/prodcfg
                readOnly: true
              # Shared init weights for the single-step parity comparison. Only
              # read when --init_state_dict_path points into it; harmless
              # otherwise. gcsfuse rather than the barnfs CSI used for the dump:
              # barnfs mounts a dataporter-PACKED directory (it runs barndle
              # mount over BFS2 shards) and cannot serve a plain .pth.
              - name: parity-ckpt
                mountPath: /mnt/parity
                readOnly: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            # gcsfuse, NOT the barnfs CSI this used to use. barnfs is not
            # registered on the TPU nodes this jobset schedules to
            # ("driver name barnfs.csi.meta.com not found in the list of
            # registered CSI drivers"), and the unmodified manifest fails the
            # same way, so it is a cluster-side gap rather than anything in this
            # config. A one-step parity run only needs the 4 batches the light
            # leg reads, so those are staged to GCS in the same v0 layout
            # (rank_R/batch_0/0.pt.zst + metadata.json) and served by gcsfuse,
            # which works. That also removes a fragile dependency from the
            # comparison entirely.
            - name: barnfs-data
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  mountOptions: "implicit-dirs"
            - name: prod-cfg
              configMap:
                name: rankfm-prod-cfg
            - name: parity-ckpt
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  # cq-mrs-core-shared_mrs_tpu_y317h, not mrs-tpu-y317h: the
                  # latter holds the dump but is read-only for us
                  # (storage.objects.create denied), so the checkpoint is staged
                  # in the same bucket TensorBoard already writes to.
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  # NOTE: onlyDir is not honored by this CSI driver as a
                  # volumeAttribute -- the whole BUCKET mounts at the mount
                  # point (verified by exec'ing into a running pod). So paths
                  # below include the bucket-relative prefix.
                  # implicit-dirs so the prefix appears as a real directory; GCS
                  # has no directories, only key prefixes.
                  mountOptions: "implicit-dirs"
