# RankFM (xsurface V3) FORWARD-ONLY benchmark on a single 2x2x1 TPU v7x host
# (4 chips = 8 jax devices). Structured like rankfm_mvai-parity-4chip.yaml:
# single-host, bypasses Kueue, runs recir.examples.rankfm_mvai.forward_benchmark
# (forward + loss only). Config via FWD_* env vars; FWD_SWEEP runs a sweep.
#
# Do NOT upgrade libtpu here (image libtpu only; a --pre upgrade breaks MXU codegen).
# Launch (self-contained, private tag, never touches :latest):
#   ./recir/examples/rankfm_mvai/run_fwd_profile.sh
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-4chip-fwd-bench-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm
              # Private tag -- never clobber the shared rankfm_mvai_tpu:latest.
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:mlui-fwd
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: PJRT_DEVICE
                value: "TPU"
              - name: FWD_DEVICE
                value: "tpu"
              - name: MASTER_PORT
                value: "29500"
              # libtpu/XLA compiler flags mirrored from the bench / parity.
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_enable_async_collective_permute=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_data_parallel_opt_different_sized_ops=true
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_enable_async_all_gather=true
              - name: FWD_EMB_BACKEND  # in_graph | cpu | tpu
                value: "cpu"
              # NOTE: switching this to in_graph at 4 chips needs a config
              # change, not an env var. The 1M table is placed ROW_WISE, which
              # at 8 jax devices is 125k rows/shard -- past the ~65k VMEM cap at
              # D=256. Give that table DATA_PARALLEL in the module config for
              # this slice. (The 64-chip slice is fine: 1M/128 ~8k rows/shard.)
              - name: FWD_ALLOW_ID_DROPPING  # tpu backend only; no-op here
                value: "1"
              # --- model + batch shape ---
              - name: FWD_GLOBAL_BS
                value: "128"
              # UIH seq S; RANKFM_S must precede FWD_SEQ (k8s dependent var) and is
              # parsed by the driver for the log name. Lower = faster (attn is O(S^2)).
              - name: RANKFM_S
                value: "1024"
              - name: FWD_ON_DEVICE_INIT
                value: "0"
              - name: FWD_SEQ
                value: "$(RANKFM_S)"
              - name: FWD_L2_SEQ
                value: "512"
              - name: FWD_L1_LAYERS
                value: "8"
              - name: FWD_L2_LAYERS
                value: "10"
              - name: FWD_NUM_CANDIDATES
                value: "10"
              - name: FWD_HASH_SIZE_CAP
                value: "1000000"
              - name: FWD_WARMUP
                value: "3"
              - name: FWD_STEPS
                value: "20"
              # Sweep one axis -> combined table (profiling auto-off). axis in:
              # seq, global_bs, num_candidates, l1_layers, l2_layers, l2_seq,
              # hash_size_cap, emb_backend.
              - name: FWD_SWEEP
                value: "global_bs=128,256;seq=512,1024,2048"
              - name: FWD_PROFILE
                value: "1"
              # For profiling: JOBSET_NAME feeds the GCS trace dir (set in the
              # command below) so the trace persists + the driver can fetch it.
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - bash
              - -c
              - |
                set -uo pipefail
                echo "=== jax devices ==="
                python3 -c "import jax; print(jax.devices())"
                export FWD_PROFILE_DIR="gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}"
                python3 -u -m recir.examples.rankfm_mvai.forward_benchmark
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            restartPolicy: Never
