# RankFM-MVAI CPU-eager vs TPU-compiled parity on the same 64-chip
# (16-host, 4x4x4) configuration as rankfm_mvai-64chip.yaml. Both cells run
# three consecutive optimizer steps over rank_0 replay batches with matching model,
# precision, batch, candidate, hash-size, optimizer, and TPU runtime settings.
#
# Submit:
#   PARITY_SKIP_BUILD=0 IMAGE_TAG=latest \
#     YAML=recir/examples/rankfm_mvai/rankfm_mvai-parity-64chip.yaml \
#     PARITY_GCS_DATA_PATH=gs://cq-mrs-core-shared_mrs_tpu_y317h/rankfm_1shard_data \
#     ./recir/examples/rankfm_mvai/run_parity.sh
#
# PARITY_USE_HELION=1 (below) puts the COMPILED cell on the recir Helion HSTU
# kernels while the CPU-eager cell stays the aten reference, so the PASS/FAIL
# verdict is a Helion numerics check. Flip it with PARITY_USE_HELION=0 on the
# run_parity.sh command line for the aten-vs-aten baseline.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-parity-64chip-
  namespace: ns-mrs-core-shared
  labels:
    kueue.x-k8s.io/queue-name: lq-training
    x.tpu.cloud.google.com/slice-autoprovisioning: "async"
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          x.tpu.google.com/inject-slice-selector: "true"
      spec:
        parallelism: 16
        completions: 16
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x4"
          spec:
            serviceAccountName: default
            containers:
            - name: parity
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: PJRT_DEVICE
                value: "TPU"
              - name: PARITY_DEVICE
                value: "tpu"
              # Match rankfm_mvai-64chip.yaml: fp32, batch 32, hash cap 10000.
              - name: PARITY_BF16
                value: "0"
              - name: PARITY_LOCAL_BATCH_SIZE
                value: "32"
              - name: PARITY_HASH_SIZE_CAP
                value: "10000"
              # Real e2e data (gs:// URI; no gcsfuse mount needed). Same rank_0 dump
              # the 64chip trainer reads, replicated across all 16 hosts.
              - name: PARITY_GCS_DATA_PATH
                value: "gs://cq-mrs-core-shared_mrs_tpu_y317h/rankfm_1shard_data"
              - name: PARITY_DATA_FILE_TEMPLATE
                value: "rank_0_batch_{i}.pt.zst"
              - name: PARITY_DATA_FILE_INDEX
                value: "1"
              - name: PARITY_STEPS
                value: "3"
              - name: MASTER_PORT
                value: "29500"
              # Extend the TPU init barrier deadline so slower-mounting pods don't
              # time out the faster ones at jax.process_index() (mirrors 64chip).
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "1800"
              - name: TPU_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: TPU_LIBRARY_INIT_TIMEOUT
                value: "1800"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: PARITY_EMB_BACKEND
                value: "in_graph"
              # Run HSTU attention on the recir Helion kernels in the COMPILED cell:
              # build_model_from_config(use_helion=True) rebinds the attention leaf
              # to the recir Helion adapter, so the STU traces the single
              # recir::helion_ragged_attention_fwd node the torchax lowering runs on
              # the Helion Pallas/Mosaic kernels (mirrors the bench's
              # RANKFM_MVAI_USE_HELION). The CPU-eager cell is unaffected -- the op's
              # eager fallback is the captured original pytorch_hstu_mha -- so it stays
              # the aten reference. Requires PARITY_EMB_BACKEND=in_graph.
              - name: PARITY_USE_HELION
                value: "1"
              # Same libtpu flags as the 64chip Helion bench, so the parity compile
              # sees the same collective scheduling / VMEM behaviour the bench
              # validated the kernels under. NOTE: libtpu FATALs on an unknown flag;
              # if a pod dies at JAX init with "Unknown flag", drop the offender.
              # Set xla_tpu_scoped_vmem_limit_kib as 64MB to disable MSA promotion and avoid tensorcore halt
              - name: LIBTPU_INIT_ARGS
                value: >-
                  --xla_tpu_scoped_vmem_limit_kib=65536
                  --xla_tpu_megacore_fusion_allow_ags=false
                  --xla_enable_async_collective_permute=true
                  --xla_tpu_enable_ag_backward_pipelining=true
                  --xla_tpu_enable_data_parallel_all_reduce_opt=true
                  --xla_tpu_data_parallel_opt_different_sized_ops=true
                  --xla_tpu_enable_async_collective_fusion=true
                  --xla_tpu_enable_async_collective_fusion_multiple_steps=true
                  --xla_tpu_overlap_compute_collective_tc=true
                  --xla_tpu_all_gather_collective_matmul_mode=post_spmd
                  --xla_tpu_reduce_scatter_collective_matmul_mode=post_spmd
                  --xla_enable_async_all_gather=true
              - name: PARITY_ON_DEVICE_INIT
                value: "0"
              command:
              - bash
              - -c
              - |
                set -uo pipefail
                echo "=== jax devices ==="
                python3 -c "import jax; print(len(jax.devices()), 'devices')" || true
                echo "=== CPU-eager vs TPU-compiled parity (64 chip) ==="
                python3 -u -m recir.examples.rankfm_mvai.parity_forward_loss
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "4x4x4"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
