# RankFM-MVAI (xsurface V3, mvai_cloud RecTrainer) full-scale training on
# 128-chip unified TPU slice (32 nodes, 4x4x8). Same model as recir/examples/rankfm,
# driven by the mvai_cloud RecTrainer framework instead of rankfm's bespoke loop.
# Uses dynamic auto-slice scheduling (tpuxpack) — ICI is wired at runtime via Slice CR.
# Pulls training batches from a barnfs dataporter dump mounted via the
# barnfs.csi.meta.com CSI driver (cluster-level creds — no per-pod cert). The
# dump is the v0 bucketed layout (rank_R/batch_S/F.pt.zst); data_pipe reads its
# metadata.json and computes the filenames arithmetically, so there is no
# `ls /mnt/barnfs` enumeration to avoid.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-ingraph-128chip-
  namespace: ns-mrs-core-shared
  labels:
    kueue.x-k8s.io/queue-name: lq-training
    x.tpu.cloud.google.com/slice-autoprovisioning: "async"
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          x.tpu.google.com/inject-slice-selector: "true"
      spec:
        parallelism: 32
        completions: 32
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x8"
              gke-gcsfuse/volumes: "true"
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm-mvai
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:linjianma-pipeline
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              # Extend the TPU init barrier deadline so slower-mounting pods
              # don't time out the faster ones at jax.process_index().
              # JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT covers the JAX-side
              # wait; TPU_INIT_TIMEOUT_SECONDS / TPU_LIBRARY_INIT_TIMEOUT
              # covers the libtpu-internal PRE_START_SESSION_BARRIER timeout
              # (which is what the DEADLINE_EXCEEDED error originates from).
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "1800"
              - name: TPU_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: TPU_LIBRARY_INIT_TIMEOUT
                value: "1800"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # mvai's TensorboardLogger writes to
              # /mnt/gcs/mvai_cloud/tensorboard/$MVAI_JOB_NAME (metrics.py:103-114);
              # set it to the jobset name so each run gets its own TB subdir.
              - name: MVAI_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Lets --prod_faithful work without //minimal_viable_ai, which is
              # not staged into this image: config._load_prod_module_config
              # reads the exported artifact instead. See prod_config_artifact.py
              # and the runbook in docs/RUNBOOK_128CHIP_PROD_CONFIG.md for how
              # the ConfigMap is produced.
              - name: PROD_CONFIG_ARTIFACT
                value: /mnt/prodcfg/prod_cfg.pt
              # How often rank 0 copies the TensorBoard events file out to GCS
              # during the run. Raise it if the copy ever shows up as gcsfuse
              # pressure; it costs nothing but staleness in the dashboard.
              - name: TB_SYNC_SECS
                value: "60"
              # libtpu's stderr logging is OFF by default in this image, which
              # swallows the one thing needed to diagnose an HBM OOM: the
              # compiler prints its "Largest program allocations in hbm"
              # breakdown at INFO, so without this the failure reports only a
              # total ("HLO temporaries (143.42G) exceeds available HBM
              # (94.75G)") and never says which buffers.
              #
              # stderr is the only reliable channel here. Per
              # rankfm_mvai-64chip-bench.yaml:150-153, the XLA dumper cannot
              # write to GCS in this environment and the pod filesystem is lost
              # when the process dies, so --xla_dump_to is not an option.
              #
              # Set to "0" to get it back: that breakdown is what identified
              # the 82.5GiB FusedMMoE fan-out, and it is the only way to see
              # which buffers an HBM OOM is actually made of. Very verbose, so
              # off by default.
              - name: TPU_STDERR_LOG_LEVEL
                value: "3"
              # Print the PYTHON stack on a fatal signal. A SIGSEGV kills the
              # process before the exception machinery runs, so the log
              # otherwise carries only a native trace whose frames are all
              # "(unknown)" (symbols are stripped) followed by pages of noise
              # from the signal handler crashing inside itself. Costs nothing
              # unless the process dies.
              - name: PYTHONFAULTHANDLER
                value: "1"
              - name: JAX_ENABLE_X64
                value: "1"
              # Which op builds the 82.52GiB f32[65,332800,128,8]? The XLA memory
              # report gives shapes but no op names, and that single tensor is
              # 87% of the budget -- 65 = b_local (padded global batch 16640 /
              # 256 devices), 332800 = 16640 x num_candidates 20. A
              # [local_batch, GLOBAL rows, ...] buffer is the shape of an
              # all-to-all or a jagged->dense pad that materialized densely.
              #
              # "1" logs embedding/index/scatter/collective ops and the
              # jagged<->dense lowering branch decisions -- enough to name the
              # producer if it is one of those. "full" dumps the entire FX graph
              # plus HLO (xla_lower.py:237-238); escalate to it only if "1" does
              # not identify the op, because the output is very large.
              # "1" logs embedding/index/scatter/collective ops and the
              # jagged<->dense lowering decisions; "full" adds the entire FX
              # graph plus HLO (xla_lower.py:237-238). "1" was enough to name
              # the op behind the 82.5GiB tensor. ~30k log lines, so off here.
              - name: RECIR_DUMP_GRAPHS
                value: "0"
              command:
              - sh
              - -c
              # Data addressing: NO --data_file_template. That flag resolves to
              # exactly ONE file (model_family.py:564,
              # `[template.format(i=1)]`) which replay_batch_iter then recycles
              # via its rotating row window, making the run a throughput
              # benchmark rather than training -- an NE/CTR curve off such a run
              # is meaningless. Without it, data_pipe._discover_files reads
              # metadata.json and synthesizes the v0 names arithmetically; it
              # never lists the directory, so there is no FUSE enumeration cost.
              #
              # NO --data_replicate_across_ranks either: replicate makes all 32
              # pods read the same file every step. Sharded (the default), pod K
              # takes global_idx = K + step*32 over the dump's 400 ranks, so the
              # 32 pods see 32 distinct shards per step -- real data
              # parallelism. PaddingRegionTransform pads every loaded batch to
              # fixed post-pad shapes, so ROW_WISE A2A tolerates the divergent
              # per-rank jagged lengths that sharding introduces.
              #
              # local_batch_size is a MULTIPLE of the dump's own batch_size
              # (512): the loader merges that many dumped batches per step, so
              # 2048 consumes four files and select_rows_slice stays a no-op. A
              # value that is not a multiple silently trains on a rotating
              # subsample of each file, which is not what production consumed.
              #
              # --data_load_workers / --data_prefetch_buffer keep the host input
              # pipeline off the critical path. At --local_batch_size 1024 a step
              # reads two 512-row files; workers=2 overlaps those two blocking
              # FUSE reads with each other, and prefetch_buffer=2 runs whole steps
              # ahead on a producer thread so the load overlaps the DEVICE step.
              # Both are the defaults and are spelled out here because they are
              # what the throughput investigation turned on -- serial loading was
              # 1.19 s/step, 37% of the step. Set both to 0/1 to reproduce the
              # old serial behaviour for an A/B.
              #
              # --seq_len_cap truncates history: hstu_max_seq_len 3554 -> the
              # cap, and mot_preprocessor keeps only the most recent events per
              # row. It is here because activation memory is superlinear in
              # sequence length and batch 2048 does not otherwise fit. The ten
              # history keys average 2929 events, so a cap of 1024 discards
              # roughly two thirds of an average history and this run's NE is
              # NOT comparable with prod's.
              #
              # num_candidates is deliberately NOT passed: under
              # --prod_faithful the NRO budget comes from prod's
              # hstu_max_output_len (=20) via _resolve_nro_per_sample
              # (xsurface_helpers.py:94-99), and the flag would be inert but
              # read as if it applied.
              #
              # bf16_training matches prod, which trains the dense tower in
              # bf16 (and even allreduces in bf16 -- see the xsurface config's
              # _ddp_config). fp32 master weights are still kept, and layernorm
              # / softmax / loss reductions stay fp32. NOTE this changes
              # activation dtypes, so it forces an XLA recompile.
              #
              # The probe checks metadata.json (which _discover_files reads
              # first) and pod K's own first shard. With the CSI driver the
              # volume is published before the container starts, so this
              # normally passes on the first check.
              # TensorBoard: rank 0 copies the events file out every
              # TB_SYNC_SECS in a BACKGROUND loop, not just at exit. The
              # end-of-run copy alone is useless for a long run -- nothing
              # reaches GCS until the trainer terminates, so a run that is still
              # going (or that gets preempted) shows nothing in TensorBoard.
              # compare_experiment.py:781-783 works around this by capping
              # --max_steps so the run COMPLETES; the loop below removes the need.
              #
              # The loop is a separate process from the trainer, so a slow or
              # rate-limited gcsfuse write stalls the copy, never the training
              # step -- which is what the original "TB straight to gcsfuse
              # rate-limits (HTTP 429) and drags the whole synchronized loop"
              # problem actually was. 60s is far below the per-object write rate
              # limit for a file this size.
              #
              # The metric window is credited the real pre-pad GLOBAL row
              # count, not the padded width (660,480 padded vs ~166,910 real
              # per step here), so its length no longer drifts with the pad
              # fraction. Unconditional -- there is no flag.
              #
              # --metric_window_size: torchrec's 1e6 default is a PER-RANK row
              # budget, so MAST's window spans ~64e6 global rows (~384 steps)
              # across its 64 GPUs. The recir metric states are already global,
              # so reproducing that span takes the global budget. Do not scale
              # this with the TPU host count -- it tracks the reference leg.
              # NOTE: this is a FOLDED (>-) scalar. A '#' anywhere below
              # comments out the rest of the command.
              - >-
                RANK=${JOB_COMPLETION_INDEX:-0} ;
                FIRST_FILE=rank_${RANK}/batch_0/0.pt.zst ;
                echo "Pod $RANK waiting for /mnt/barnfs/metadata.json and /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/metadata.json ] || [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "barnfs mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                TB_SRC=/mnt/gcs/mvai_cloud/tensorboard/${JOBSET_NAME} ;
                TB_DST=/mnt/gcs-out/tensorboard/${JOBSET_NAME} ;
                if [ "${RANK}" = "0" ]; then
                  mkdir -p "$TB_DST" ;
                  echo "TB sync loop -> gs://cq-mrs-core-shared_mrs_tpu_y317h/tensorboard/${JOBSET_NAME} every ${TB_SYNC_SECS}s" ;
                  ( while true; do
                      sleep "${TB_SYNC_SECS}" ;
                      cp "$TB_SRC"/* "$TB_DST"/ 2>/dev/null || true ;
                    done ) &
                  TB_SYNC_PID=$! ;
                fi ;
                python3 -u -m recir.examples.rankfm_mvai.train
                --max_steps 320725
                --local_batch_size 1024
                --seq_len_cap 1024
                --prod_faithful
                --bf16_training
                --embedding_backend in_graph
                --gcs_data_path /mnt/barnfs
                --data_load_workers 2
                --data_prefetch_buffer 32
                --metrics_report_interval 100
                --in_graph_metrics
                --metric_window_size 64000000
                --pipeline_preprocessor
                --profile_start_step 900
                --profile_end_step 906
                --profile_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}" ;
                rc=$? ;
                if [ "${RANK}" = "0" ]; then
                  kill "$TB_SYNC_PID" 2>/dev/null || true ;
                  echo "Final TensorBoard copy -> gs://cq-mrs-core-shared_mrs_tpu_y317h/tensorboard/${JOBSET_NAME} ..." ;
                  mkdir -p "$TB_DST" ;
                  cp "$TB_SRC"/* "$TB_DST"/ || true ;
                fi ;
                exit $rc
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
              - name: prod-cfg
                mountPath: /mnt/prodcfg
                readOnly: true
              # Local emptyDir: TB events are written here during training (fast).
              # Writing TB straight to gcsfuse rate-limits (HTTP 429) on the
              # growing events file and stalls the loop -- see volumes below.
              - name: tensorboard
                mountPath: /mnt/gcs/mvai_cloud
              # gcsfuse: rank 0 copies the finished events here at end of run.
              - name: tb-gcs
                mountPath: /mnt/gcs-out
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "4x4x8"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            # BarnFS dataporter dump, mounted by the barnfs.csi.meta.com CSI
            # driver. The driver stages the GCS bucket with its own gcsfuse and
            # runs `barndle mount` on the dump dir, authenticating with the
            # cluster-level BarnFS credential (GKE Workload Identity + Internet
            # Shepherd) — so no per-pod barnfs-certs secret is required.
            - name: barnfs-data
              csi:
                driver: barnfs.csi.meta.com
                readOnly: true
                volumeAttributes:
                  # 3-day dump, Dataporter-transferred (BarnFS-encrypted
                  # shards + BFS2_SHARD_MAP; the CSI driver decrypts at
                  # mount, which is why the logical files are not visible
                  # with plain `gcloud storage ls`). The trailing ":v0" is
                  # part of the dataporter transfer id, not the dump format.
                  # Source of truth for the layout is the Manifold original,
                  # manifold://mrs_recsys_gcp/tree/czheo_test/udd_fm_3d_20260824,
                  # whose metadata.json reads
                  # {"version": 0, "num_ranks": 400, "num_batches": 51316,
                  #  "batch_size": 512} -- i.e. the v0 bucketed layout
                  # rank_R/batch_S/F.pt.zst, 400 shards, stride 512.
                  sourcePath: "gs://mrs-tpu-y317h/czheo_test/udd_fm_3d_20260824/dataporter_2:prod:dataporter:xdb.mwfs_orchestration_prod:4070:467780:v0/"
            # TensorBoard events. mvai's TensorboardLogger hardcodes
            # /mnt/gcs/mvai_cloud/tensorboard/$MVAI_JOB_NAME (metrics.py) and
            # appends to a single events file at every metric report. Backing
            # that path with gcsfuse makes gcsfuse re-upload the whole growing
            # (non-empty) file on each flush ("legacy staged writes"), which
            # exceeds GCS's per-object write rate limit (HTTP 429), stalls the
            # per-step report, and drags the whole synchronized loop. So write TB
            # to a LOCAL emptyDir during training instead...
            # Prod's config, exported on a devserver and published as a
            # ConfigMap (~70KB, well under the 1MB limit). Not a bucket: this
            # avoids a GCS round trip on every iteration.
            - name: prod-cfg
              configMap:
                name: rankfm-prod-cfg
            - name: tensorboard
              emptyDir: {}
            # ...and have rank 0 copy the finished events to the SA-owned bucket
            # once at end of run (a new file written sequentially uses gcsfuse
            # streaming writes -> no rate limiting). Requires the
            # ns-mrs-core-shared default SA to have write access to this bucket.
            - name: tb-gcs
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: cq-mrs-core-shared_mrs_tpu_y317h
                  mountOptions: "implicit-dirs"
