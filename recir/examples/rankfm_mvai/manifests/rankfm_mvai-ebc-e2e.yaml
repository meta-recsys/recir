# Task 1.3: a PyTorch recsys model whose pooled lookup runs on the ring-shift
# kernel, trained for a few steps on synthetic data.
#
# This image, not the examples/embedding one: the model is PyTorch, and that
# image installs jax only. torchrec being here too is what lets the CPU
# reference run in the same process instead of through an exported artifact.
#
# The run passes when EITHER:
#   * the loss goes down, or
#   * its curve tracks an eager-PyTorch run from the same init and batches,
#     step by step. With the CPU reference enabled, parity is the stronger
#     signal: independently random labels make first-vs-last loss noisy.
#
# Headline: `=== RESULT ebc_e2e: PASS|FAIL descended=.. parity=.. max_rel=.. ===`
# A copy/paste-ready Markdown report is printed between
# `EBC_E2E_REPORT_BEGIN` and `EBC_E2E_REPORT_END`; it includes every CPU/TPU
# loss pair and first-step per-parameter gradient comparison statistics.
#
# Run from recir/examples/rankfm_mvai with:
#   scripts/run_tpu_bench.sh rankfm_mvai-ebc-e2e.yaml
# The driver builds the image, submits this JobSet, retrieves the xprof trace,
# and publishes the rank-0 trace to Kernelhub. In the trace, confirm that the
# profiled training steps contain the pooled ring-shift Pallas call.
#
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-mvai-ebc-e2e-
  namespace: ns-mrs-core-shared
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          spec:
            containers:
            - name: rankfm-mvai
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              - >-
                python3 -u -m recir.examples.rankfm_mvai.ebc_e2e
                --steps 40
                --batch-size 64
                --max-bag 8
                --vocab 4096
                --dim 32
                --profile_start_step 3
                --profile_end_step 8
                --profile_dir "gs://cq-mrs-core-shared_mrs_tpu_y317h/tpu-profiles/${JOBSET_NAME}"
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            restartPolicy: Never
