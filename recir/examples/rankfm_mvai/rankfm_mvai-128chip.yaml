# RankFM-MVAI (xsurface V3, mvai_cloud RecTrainer) full-scale training on
# 128-chip unified TPU slice (32 nodes, 4x4x8). Same model as recir/examples/rankfm,
# driven by the mvai_cloud RecTrainer framework instead of rankfm's bespoke loop.
# Uses dynamic auto-slice scheduling (tpuxpack) — ICI is wired at runtime via Slice CR.
# Pulls training batches from a barnfs dataporter dump mounted via the
# barnfs.csi.meta.com CSI driver (cluster-level creds — no per-pod cert); the
# trainer reads on-demand using --data_file_template so we avoid the
# multi-minute `ls /mnt/barnfs` FUSE enumeration tax.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-mvai-128chip-
  namespace: ns-enablement-mrs-foundation
  labels:
    kueue.x-k8s.io/queue-name: lq-training
    x.tpu.cloud.google.com/slice-autoprovisioning: "async"
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          x.tpu.google.com/inject-slice-selector: "true"
      spec:
        parallelism: 32
        completions: 32
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x8"
              gke-gcsfuse/volumes: "true"
          spec:
            serviceAccountName: default
            containers:
            - name: rankfm-mvai
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              # Extend the TPU init barrier deadline so slower-mounting pods
              # don't time out the faster ones at jax.process_index().
              # JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT covers the JAX-side
              # wait; TPU_INIT_TIMEOUT_SECONDS / TPU_LIBRARY_INIT_TIMEOUT
              # covers the libtpu-internal PRE_START_SESSION_BARRIER timeout
              # (which is what the DEADLINE_EXCEEDED error originates from).
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "1800"
              - name: TPU_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: TPU_LIBRARY_INIT_TIMEOUT
                value: "1800"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # mvai's TensorboardLogger writes to
              # /mnt/gcs/mvai_cloud/tensorboard/$MVAI_JOB_NAME (metrics.py:103-114);
              # set it to the jobset name so each run gets its own TB subdir.
              - name: MVAI_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              # NOTE: the dataporter dump has ~100K files; `ls /mnt/barnfs`
              # takes 58+ min on FUSE due to full directory enumeration. We
              # avoid that entirely by passing --data_file_template to the
              # trainer, so BatchReplayPipe builds the filename list itself
              # (no listdir) and reads on-demand via FUSE's lazy lookup
              # (sub-second per known filename).
              #
              # Per-pod data: $RANK (= JOB_COMPLETION_INDEX) is baked into
              # the template so pod K reads ``rank_K_batch_1.pt.zst`` from
              # the dump's K-th shard. With 32 pods that's 32 distinct files
              # per step → real data parallelism (vs all-ranks-same when the
              # template was hardcoded to rank_0). Requires the dump to have
              # >= 32 dump-ranks; verified for this dataporter snapshot.
              # PaddingRegionTransform pads each loaded batch to fixed
              # post-pad shapes (per-trace pair_padded_bs = local_batch_size
              # * num_candidates), so ROW_WISE A2A still works across ranks.
              #
              # With the CSI driver the volume is published before the
              # container starts, so this per-pod probe normally passes on the
              # first check; it's kept as a cheap guard that pod K sees its own
              # shard before reaching jax.process_index().
              - >-
                RANK=${JOB_COMPLETION_INDEX:-0} ;
                FIRST_FILE=rank_${RANK}_batch_1.pt.zst ;
                echo "Pod $RANK waiting for /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "barnfs mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm_mvai.train
                --max_steps 20
                --local_batch_size 32
                --num_candidates 32
                --hash_size_cap 1000000
                --l1_num_layers 3
                --l2_num_layers 11
                --embedding_backend cpu
                --gcs_data_path /mnt/barnfs
                --data_file_template "rank_${RANK}_batch_{i}.pt.zst"
                --data_replicate_across_ranks
                --profile_start_step 3
                --profile_end_step 8
                --profile_dir "gs://mrs-tpu-y317h/tpu-profiles/${JOBSET_NAME}"
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                readOnly: true
              - name: tensorboard
                mountPath: /mnt/gcs/mvai_cloud
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "4x4x8"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            # BarnFS dataporter dump, mounted by the barnfs.csi.meta.com CSI
            # driver. The driver stages the GCS bucket with its own gcsfuse and
            # runs `barndle mount` on the dump dir, authenticating with the
            # cluster-level BarnFS credential (GKE Workload Identity + Internet
            # Shepherd) — so no per-pod barnfs-certs secret is required.
            - name: barnfs-data
              csi:
                driver: barnfs.csi.meta.com
                readOnly: true
                volumeAttributes:
                  sourcePath: "gs://mrs-tpu-y317h/datasets/udd_fm_20260415_dump/"
            # TensorBoard scalar-metrics (loss/QPS/NE) sink. mvai's
            # TensorboardLogger hardcodes /mnt/gcs/mvai_cloud/tensorboard/$MVAI_JOB_NAME
            # (metrics.py); back that path with a gcsfuse RW mount of the
            # SA-owned bucket so the event files persist to GCS (mirrors how
            # mvai_cloud's GPU cluster persists TB). Requires the
            # ns-enablement-mrs-foundation default SA to have write access to
            # this bucket (same SA + bucket as the profiler-output fix).
            - name: tensorboard
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: cq-enablement-mrs-foundation_mrs_tpu_y317h
                  mountOptions: "implicit-dirs"
