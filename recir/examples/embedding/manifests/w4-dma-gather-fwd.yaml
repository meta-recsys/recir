# Set IMAGE=<registry>/ringshift_tpu:<tag> and render with envsubst before applying.
# W=4 single-host correctness for the HBM per-row DMA-gather forward path.
# Uses a large per-shard table (v_local=64K, D=128 f32 -> 32MB > the 16MB VMEM
# budget) so the kernel gathers rows directly from the HBM shard instead of the
# whole-shard VMEM prefetch. The tests assert _use_dma_gather(...) is True, so a
# PASS confirms the DMA-gather path was actually exercised (and is bitwise
# correct vs the ra2a reference). Also runs the prefetch-path guard.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: ringshift-w4-dma-fwd-
  namespace: default
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        activeDeadlineSeconds: 1500
        template:
          spec:
            containers:
            - name: bench
              image: ${IMAGE}
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "900"
              command:
              - bash
              - -c
              - |
                set +e
                echo "Job Start: $(date) host: $(hostname)"
                cd /app/recir
                timeout 1400 python3 -u -m unittest -v \
                  recir.examples.embedding.ringshift_fwd.RingshiftFwdCorrectnessTest.test_w4_dma_gather \
                  recir.examples.embedding.ringshift_fwd.RingshiftFwdCorrectnessTest.test_w4_dma_gather_chunked \
                  recir.examples.embedding.ringshift_fwd.RingshiftFwdCorrectnessTest.test_w4_prefetch_path 2>&1
                EXIT=$?
                echo ""
                echo "BENCH_EXIT=$EXIT"
                echo "Job End: $(date)"
                exit $EXIT
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            restartPolicy: Never
