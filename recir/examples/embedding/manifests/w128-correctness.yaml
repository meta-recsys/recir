# W=128 numerical correctness test for the fused ringshift embedding lookup.
# Compares fused (ringshift_embedding_lookup, splitter='globalpad') against
# the ra2a reference. Uses random fp32 table so the diff is meaningful.
# Pod timeout = 1800s (compile takes longer at W=128).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: ringshift-w128-corr-
  namespace: default
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 32
        completions: 32
        backoffLimit: 0
        activeDeadlineSeconds: 1800
        template:
          spec:
            containers:
            - name: bench
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/ringshift_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "900"
              command:
              - bash
              - -c
              - |
                set +e
                echo "Job Start: $(date) host: $(hostname)"
                cd /app/recir
                timeout 1700 python3 -u -m unittest -v \
                  recir.examples.embedding.ringshift_fwd.RingshiftFwdCorrectnessTest.test_w128_correctness 2>&1
                EXIT=$?
                echo ""
                echo "BENCH_EXIT=$EXIT"
                echo "Job End: $(date)"
                exit $EXIT
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 4x4x8
            restartPolicy: Never
