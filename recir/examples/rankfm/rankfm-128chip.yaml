# RankFM (xsurface V3) full-scale training on 128-chip unified TPU slice (32 nodes, 4x4x8)
# Uses dynamic auto-slice scheduling (tpuxpack) — ICI is wired at runtime via Slice CR.
# Pulls training batches from a barnfs-mounted dataporter dump via a sidecar
# init container; the trainer reads on-demand using --data_file_template so we
# avoid the multi-minute `ls /mnt/barnfs` FUSE enumeration tax.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: rankfm-128chip-
  namespace: ns-enablement-mrs-foundation
  labels:
    kueue.x-k8s.io/queue-name: lq-training
    x.tpu.cloud.google.com/slice-autoprovisioning: "async"
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          x.tpu.google.com/inject-slice-selector: "true"
      spec:
        parallelism: 32
        completions: 32
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x4x8"
              gke-gcsfuse/volumes: "true"
          spec:
            serviceAccountName: default
            initContainers:
            - name: barnfs-mount
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recsys-tpu/barnfs
              restartPolicy: Always
              env:
              - name: OTEL_SDK_DISABLED
                value: "true"
              - name: THRIFT_TLS_CL_CERT_PATH
                value: "/etc/barnfs-certs/tls-combined.pem"
              - name: THRIFT_TLS_CL_KEY_PATH
                value: "/etc/barnfs-certs/tls.key"
              command: ["sh", "-c"]
              args:
              - |
                mkdir -p /mnt/barnfs
                ./barnfs barndle mount /mnt/mrs-tpu-y317h/datasets/udd_fm_20260415_dump/ /mnt/barnfs
              securityContext:
                privileged: true
              volumeMounts:
              - name: gcs-mrs-tpu
                mountPath: /mnt/mrs-tpu-y317h
                readOnly: true
              - name: barnfs-data
                mountPath: /mnt/barnfs
                mountPropagation: Bidirectional
              - name: barnfs-certs
                mountPath: /etc/barnfs-certs
                readOnly: true
            containers:
            - name: rankfm
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MASTER_PORT
                value: "29500"
              # Extend the TPU init barrier deadline so slower-mounting pods
              # don't time out the faster ones at jax.process_index().
              # JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT covers the JAX-side
              # wait; TPU_INIT_TIMEOUT_SECONDS / TPU_LIBRARY_INIT_TIMEOUT
              # covers the libtpu-internal PRE_START_SESSION_BARRIER timeout
              # (which is what the DEADLINE_EXCEEDED error originates from).
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "1800"
              - name: TPU_INIT_TIMEOUT_SECONDS
                value: "1800"
              - name: TPU_LIBRARY_INIT_TIMEOUT
                value: "1800"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              # NOTE: the dataporter dump has ~100K files; `ls /mnt/barnfs`
              # takes 58+ min on FUSE due to full directory enumeration. We
              # avoid that entirely by passing --data_file_template to the
              # trainer, so BatchReplayPipe builds the filename list itself
              # (no listdir) and reads on-demand via FUSE's lazy lookup
              # (sub-second per known filename).
              #
              # Per-pod data: $RANK (= JOB_COMPLETION_INDEX) is baked into
              # the template so pod K reads ``rank_K_batch_1.pt.zst`` from
              # the dump's K-th shard. With 32 pods that's 32 distinct files
              # per step → real data parallelism (vs all-ranks-same when the
              # template was hardcoded to rank_0). Requires the dump to have
              # >= 32 dump-ranks; verified for this dataporter snapshot.
              # PaddingRegionTransform pads each loaded batch to fixed
              # post-pad shapes (per-trace pair_padded_bs = local_batch_size
              # * num_candidates), so ROW_WISE A2A still works across ranks.
              #
              # The mount-ready probe uses the same per-pod file so pod K
              # waits for its own shard before reaching jax.process_index().
              - >-
                RANK=${JOB_COMPLETION_INDEX:-0} ;
                FIRST_FILE=rank_${RANK}_batch_1.pt.zst ;
                echo "Pod $RANK waiting for /mnt/barnfs/$FIRST_FILE as mount-ready probe..." ;
                START=$(date +%s) ;
                while [ ! -e /mnt/barnfs/$FIRST_FILE ]; do
                  sleep 5 ;
                done ;
                echo "barnfs mount ready (after $(($(date +%s) - START))s); starting trainer..." ;
                python3 -u -m recir.examples.rankfm.train
                --max_steps 20
                --local_batch_size 32
                --num_candidates 32
                --hash_size_cap 1000000
                --l1_num_layers 3
                --l2_num_layers 11
                --embedding_backend cpu
                # --gcs_data_path /mnt/barnfs
                # --data_file_template "rank_${RANK}_batch_{i}.pt.zst"
                --data_replicate_across_ranks
                --profile_start_step 3
                --profile_end_step 8
                --profile_dir "gs://mrs-tpu-y317h/tpu-profiles/${JOBSET_NAME}"
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
              volumeMounts:
              - name: barnfs-data
                mountPath: /mnt/barnfs
                mountPropagation: HostToContainer
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: "4x4x8"
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            restartPolicy: Never
            volumes:
            - name: gcs-mrs-tpu
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: mrs-tpu-y317h
                  # 100Gi/5Gi got pods evicted by ephemeral-storage; 0 made
                  # gcsfuse so slow that pods reached jax.process_index() at
                  # very different times and tripped the JAX init barrier.
                  # 2Gi is a compromise: enough cache to avoid per-read GCS
                  # round-trips for the few barndle files we read; small
                  # enough to fit on the node alongside other consumers.
                  fileCacheCapacity: "2Gi"
                  metadataCacheTTLSeconds: "-1"
            - name: barnfs-data
              emptyDir: {}
            - name: barnfs-certs
              secret:
                secretName: barnfs-certs
