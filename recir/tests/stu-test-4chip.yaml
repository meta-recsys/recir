# Run recir/tests/stu_test.py on a 4-chip TPU v7 slice (1 node, 2x2x1).
# Single-node test job: parallelism/completions 1 (no multi-rank ICI needed).
# Reuses the rankfm_mvai_tpu image (recir + generative_recommenders are baked in);
# stu_test.py only imports recir.* and generative_recommenders.modules.stu, so
# no barnfs data mount or overrides are required.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: stu-test-4chip-
  namespace: ns-enablement-mrs-foundation
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            containers:
            - name: stu-test
              image: us-central1-docker.pkg.dev/mrs-tpu-y317h/recml/rankfm_mvai_tpu:latest
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              command:
              - sh
              - -c
              - >-
                python3 -u -m unittest -v recir.tests.stu_test
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            restartPolicy: Never
