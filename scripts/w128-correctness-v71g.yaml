# W=128 numerical correctness test for fused ringshift kernel (v71g).
# Compares fused (jagged_a2a_embedding_lookup_f32_alltc_ringshift, splitter=globalpad)
# against ra2a reference. Uses random fp32 table (NOT zero) so diff is meaningful.
# v71g extends v71d by overlaying the new test file with W=64/W=128 correctness methods.
# Pod timeout = 1800s (compile takes longer at W=128).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: shenli-w128-corr-v71g-
  namespace: default
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 32
        completions: 32
        backoffLimit: 0
        activeDeadlineSeconds: 1800
        template:
          spec:
            containers:
            - name: bench
              image: gcr.io/mrs-tpu-y317h/shenli-runner:v71g
              imagePullPolicy: Always
              env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: JAX_DISTRIBUTED_INITIALIZATION_TIMEOUT
                value: "900"
              command:
              - bash
              - -c
              - |
                set +e
                echo "Job Start: $(date) host: $(hostname)"
                cd /app/recir
                timeout 1700 python3 -u -m unittest -v recir.ops.pallas.embeddings.tests.test_jagged_a2a_w128_bench.JaggedA2AW128Benchmark.test_w128_correctness 2>&1
                EXIT=$?
                echo ""
                echo "BENCH_EXIT=$EXIT"
                echo "Job End: $(date)"
                exit $EXIT
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 4x4x8
            restartPolicy: Never
