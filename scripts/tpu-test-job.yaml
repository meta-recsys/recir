apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: tpu-test
  namespace: default
spec:
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          spec:
            containers:
            - name: tpu-test
              # Render with IMAGE=<registry>/<image>:<tag> envsubst before use.
              image: ${IMAGE}
              command:
              - python3
              - -c
              - |
                import jax
                import jax.numpy as jnp

                print("=" * 60)
                print("TPU Multi-Node Test")
                print("=" * 60)

                # Initialize JAX and detect devices
                devices = jax.devices()
                local_devices = jax.local_devices()
                print(f"Process index: {jax.process_index()}")
                print(f"Process count: {jax.process_count()}")
                print(f"Total devices: {len(devices)}")
                print(f"Local devices: {len(local_devices)}")
                for d in local_devices:
                    print(f"  - {d}")

                # Test 1: Local computation
                x = jnp.ones((1024, 1024))
                y = jnp.dot(x, x)
                print(f"\nTest 1 - Local matmul: shape={y.shape}, sum={float(y.sum()):.0f}")

                # Test 2: pmap across local devices
                @jax.pmap
                def add_one(x):
                    return x + 1

                data = jnp.arange(len(local_devices), dtype=jnp.float32)
                result = add_one(data)
                print(f"Test 2 - pmap result: {result}")

                print("\n" + "=" * 60)
                print(f"SUCCESS: Process {jax.process_index()} completed all tests")
                print("=" * 60)
              ports:
              - containerPort: 8471
              resources:
                limits:
                  google.com/tpu: 4
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
            restartPolicy: Never
